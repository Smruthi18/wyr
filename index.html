<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Rather Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Would You Rather?</h1>
        <div class="question-container">
            <p id="questionText">Loading question...</p>
        </div>
        <div class="options">
            <button id="option1Btn" class="option-btn">Option 1</button>
            <button id="option2Btn" class="option-btn">Option 2</button>
        </div>
        <div class="response">
            <p id="responseText"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
